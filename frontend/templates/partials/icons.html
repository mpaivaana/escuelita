{# Ícones de traço fino, no espírito dos desenhos em giz #}
{% macro icon(name, size=28) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'hands' %}
  <path d="M4 22h4l6 4h9a2 2 0 0 0 0-4h-6"/><path d="M8 22v-6h3l5 3h3a2 2 0 0 1 0 4"/><path d="M20 14c-3-2-5-4-5-6.3A2.7 2.7 0 0 1 20 6a2.7 2.7 0 0 1 5 1.7C25 10 23 12 20 14z"/>
{%- elif name == 'target' %}
  <circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="4"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5"/>
{%- elif name == 'globe' %}
  <circle cx="16" cy="16" r="12"/><path d="M6 10c4 0 5 3 8 3s2 4 5 4 3 4 1 7"/><path d="M19 4.5c-1 2 0 4 3 4.5s4 2 5.5 1"/>
{%- elif name == 'leaf' %}
  <path d="M6 26C6 14 13 6 27 5c0 13-7 21-19 21"/><path d="M6 26 18 14"/>
{%- elif name == 'whatsapp' %}
  <path d="M6 26l1.6-5A11 11 0 1 1 11 24.5z"/><path d="M12 11.5c0 4.5 4 8.5 8.5 8.5l1.5-2-3-1.5-1.3 1.2c-1.6-.7-2.7-1.8-3.4-3.4l1.2-1.3L14 10z"/>
{%- elif name == 'mail' %}
  <rect x="4" y="7" width="24" height="18" rx="3"/><path d="m5 9 11 8 11-8"/>
{%- elif name == 'instagram' %}
  <rect x="5" y="5" width="22" height="22" rx="6"/><circle cx="16" cy="16" r="5"/><circle cx="22.5" cy="9.5" r=".6" fill="currentColor"/>
{%- elif name == 'arrow' %}
  <path d="M5 16h22"/><path d="m19 8 8 8-8 8"/>
{%- elif name == 'linkedin' %}
  <rect x="5" y="5" width="22" height="22" rx="4"/><path d="M11 14v8M11 10.5v.01M15.5 22v-8M15.5 17.5c0-2 1.3-3.5 3.2-3.5s2.8 1.3 2.8 3.5V22"/>
{%- elif name == 'send' %}
  <path d="M5 16 27 6l-6 21-5-9z"/><path d="m16 18 11-12"/>
{%- elif name == 'menu' %}
  <path d="M5 10h22M5 16h22M5 22h22"/>
{%- endif %}
</svg>
{%- endmacro %}
