<article class="project" data-reveal style="--d: {{ loop.index0 * 110 }}ms">
  <div class="project-media">
    {% if p.image %}<img src="{{ p.image }}" alt="" loading="lazy">{% endif %}
    {% if p.year %}<span class="project-year">{{ p.year }}</span>{% endif %}
  </div>
  <h3>{{ p.title }}</h3>
  {% if p.partner %}<p class="project-partner">{{ ui.with_partner.format(partner=p.partner) }}</p>{% endif %}
  {% if p.summary %}<p class="project-summary">{{ p.summary }}</p>{% endif %}
</article>
